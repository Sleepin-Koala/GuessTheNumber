# Blueprint Render: le serveur (API + WebSocket) sur l'offre GRATUITE. La base est chez Neon (gratuit aussi), le site chez
# Cloudflare Pages. Voir DEPLOY.md. Les valeurs secretes se saisissent dans le tableau de bord Render (sync: false).
services:
  - type: web
    name: plus-minus-api
    runtime: docker
    plan: free
    region: frankfurt                 # la plus proche de Paris
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GTN_DATABASE_URL         # adresse de connexion donnee par Neon (postgresql://...)
        sync: false
      - key: GTN_ALLOWED_ORIGINS      # adresse du site Cloudflare Pages (https://<projet>.pages.dev)
        sync: false
      - key: GTN_TRUST_PROXY
        value: "1"
      - key: GOOGLE_CLIENT_ID          # "Continuer avec Google" (voir DEPLOY.md, section Google); vide = bouton masque
        sync: false
      - key: GTN_PROXY_HOPS           # proxys devant le serveur (Cloudflare + Render): 3, verifie avec /whoami (voir DEPLOY.md)
        value: "3"
