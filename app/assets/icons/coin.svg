<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Contrairement aux icônes de contrôle (play, settings...), une pièce
       a une couleur "propre" indépendante du bouton où elle se trouve :
       l'or n'est pas négociable, une pièce doit toujours être dorée. -->
  <circle cx="24" cy="24" r="17" fill="#FFCC00" stroke="#000000" stroke-width="3.5"/>
  <circle cx="24" cy="24" r="10.5" fill="none" stroke="#000000" stroke-width="2.2" opacity="0.5"/>
</svg>
