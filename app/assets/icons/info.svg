<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Cercle de fond : contour noir épais, remplissage blanc. -->
  <circle cx="24" cy="24" r="17" fill="#FFFFFF" stroke="#000000" stroke-width="3.5"/>
  <!-- Le point du "i" : petit cercle plein noir. -->
  <circle cx="24" cy="15.5" r="3.2" fill="#000000"/>
  <!-- La barre du "i" : rectangle arrondi plein noir. -->
  <rect x="20.2" y="21" width="7.6" height="14.5" rx="3.5" fill="#000000"/>
</svg>
