<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Arc de cercle (270°, pas fermé) + une pointe de flèche à une
       extrémité pour suggérer la rotation, même langage "double tracé"
       que close/check/logout. -->
  <g fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round">
    <path d="M 38,24 A 14,14 0 1 1 32,13"/>
    <polyline points="32,5 32,14 41,14"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round">
    <path d="M 38,24 A 14,14 0 1 1 32,13"/>
    <polyline points="32,5 32,14 41,14"/>
  </g>
</svg>
